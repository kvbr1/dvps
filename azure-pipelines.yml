trigger:
  branches:
    include:
      - kvbr1-patch-1  # Change to your branch name

pool:
  vmImage: 'ubuntu-latest'

variables:
  PYTHON_VERSION: '3.11'
  #SONARQUBE_SERVICE_CONNECTION: 'your-sonarqube-service-connection'
  SONARQUBE_PROJECT_KEY: 'test-self-repo'
  SONARQUBE_PROJECT_NAME: 'test-self-repo'

steps:
  - checkout: self

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(PYTHON_VERSION)'
    displayName: 'Use Python $(PYTHON_VERSION)'

  - task: JavaToolInstaller@1
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'
    displayName: 'Install JDK (required for SonarQube)'

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Install Python dependencies'

  - task: SonarQubePrepare@5
    inputs:
      SonarQube: '$(SONARQUBE_SERVICE_CONNECTION)'
      scannerMode: 'CLI'
      configMode: 'manual'
      cliProjectKey: '$(SONARQUBE_PROJECT_KEY)'
      cliProjectName: '$(SONARQUBE_PROJECT_NAME)'
      cliSources: '.'

  - task: SonarQubeAnalyze@5
    displayName: 'Run SonarQube Analysis'

  - task: SonarQubePublish@5
    inputs:
      pollingTimeoutSec: '300'
    displayName: 'Publish SonarQube Report'
