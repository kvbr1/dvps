trigger:
  branches:
    include:
      - kvbr1-patch-1  # Replace with your working branch

pool:
  vmImage: 'ubuntu-latest'

variables:
  PYTHON_VERSION: '3.11'
  SONARQUBE_HOST_URL: 'http://20.185.151.89:9000/'  # 🔁 Replace with your SonarQube URL
  SONARQUBE_PROJECT_KEY: 'test-self-repo'
  SONARQUBE_PROJECT_NAME: 'test-self-repo'

steps:
  #- checkout: self

 # - task: UsePythonVersion@0
 #   inputs:
 #    versionSpec: '$(PYTHON_VERSION)'
#    displayName: 'Set Python Version'

#  - script: |
 #     python -m pip install --upgrade pip
 #     pip install -r requirements.txt
  #  displayName: 'Install Python Dependencies'

  - script: |
      sudo apt-get update
      sudo apt-get install -y openjdk-17-jdk unzip wget
    displayName: 'Install Java (for SonarQube CLI)'

  - script: |
      echo "Branch Name: $(Build.SourceBranchName)"
    displayName: 'Show Current Branch Name'


  - script: |
      wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
      unzip sonar-scanner-cli-5.0.1.3006-linux.zip
      export PATH=$(pwd)/sonar-scanner-5.0.1.3006-linux/bin:$PATH

      sonar-scanner \
        -Dsonar.projectKey=$(SONARQUBE_PROJECT_KEY) \
        -Dsonar.projectName=$(SONARQUBE_PROJECT_NAME) \
        -Dsonar.sources=. \
        -Dsonar.host.url=$(SONARQUBE_HOST_URL) \
        -Dsonar.login=$(SONAR_TOKEN) \
        -Dsonar.branch.name=$(Build.SourceBranchName)
    env:
      SONAR_TOKEN: $(SONAR_TOKEN)  # 🔐 Store this in Azure DevOps as a secret variable
    displayName: 'Run SonarQube Scan via CLI'
